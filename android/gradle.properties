org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Jetifier is no longer required (all deps are AndroidX); it can interfere with androidx.window packaging.
android.enableJetifier=false
# Built-in Kotlin (AGP 9). KGP is no longer applied by the app or mobile_scanner 7.4.1+.
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Pub cache is on a different drive (H:) than the project (D:); Kotlin incremental caches break on cross-root paths.
kotlin.incremental=false
