name: keestone
description: "A KeePass-compatible password manager built with Flutter."
publish_to: 'none'
version: 1.0.0+24
environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # KDBX library
  kpasslib: ^1.1.2

  # State management
  flutter_riverpod: ^3.4.3

  # Routing
  go_router: ^18.0.1

  # File picking
  file_picker: ^13.3.2

  # CSV parsing
  csv: ^8.0.0

  # TOTP generation
  otp: ^3.0.0

  # QR code scanning (TOTP setup)
  mobile_scanner: ^7.4.1

  # Platform paths
  path_provider: ^2.1.5

  # Secure storage (recent files only, never passwords)
  flutter_secure_storage: ^11.1.1

  # Biometric authentication (Android + iOS)
  local_auth_android: ^2.0.9
  local_auth_darwin: ^2.0.3
  local_auth_platform_interface: ^1.1.0

  # Local notifications (expiration reminders)
  flutter_local_notifications: ^22.3.0

  # Windows native notifications
  win32: ^6.4.0
  ffi: ^2.1.4

  # System tray & window management
  tray_manager: ^0.8.3
  window_manager: ^0.6.0

  # UI helpers
  # Logging
  logger: ^2.5.0

  webdav_client: ^1.2.2
  dio: ^5.9.0
  image_picker: ^1.2.3

  # AES-GCM encryption for stored WebDAV passwords
  cryptography: ^2.7.0
  material_ui: ^1.1.0
  image: ^4.10.1
  zxing_lib: ^1.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  qr: ^4.0.0
  xml: ^6.2.2

dependency_overrides:
  kpasslib:
    path: third_party/kpasslib

flutter:
  uses-material-design: true
  generate: true

  assets:
    - pubspec.yaml
    - assets/icons/
    - assets/icons/seeds/
