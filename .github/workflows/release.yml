name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            msvc_arch: x64
            # Stable publishes no Windows arm64 archive; master clones the
            # pinned tag and bootstraps the host's own Dart/engine artifacts.
            flutter_channel: stable
          - arch: arm64
            runner: windows-11-arm
            msvc_arch: arm64
            flutter_channel: master
    steps:
      - name: Setup Rust (Windows ARM64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain 1.90.0
          echo "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: actions/checkout@v7

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install Rust
        if: matrix.arch == 'x64'
        uses: dtolnay/rust-toolchain@1.90.0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/kreepto-rust/target
          key: windows-${{ matrix.arch }}-cargo-${{ hashFiles('native/kreepto-rust/Cargo.toml') }}
          restore-keys: windows-${{ matrix.arch }}-cargo-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: ${{ matrix.flutter_channel }}
          cache: true

      - run: flutter --version

      - run: flutter pub get

      - name: Build kreepto native library
        run: cargo build --release
        working-directory: native/kreepto-rust

      - name: Build Flutter Windows app
        # Windows desktop has no --target-platform flag; arch comes from MSVC.
        run: flutter build windows --release

      - name: Bundle native library
        shell: pwsh
        run: |
          $bundleDir = "build\windows\${{ matrix.arch }}\runner\Release"
          if (-not (Test-Path $bundleDir)) {
            Get-ChildItem -Recurse build\windows -ErrorAction SilentlyContinue | Select-Object -First 50 FullName
            throw "Flutter Windows bundle directory not found: $bundleDir"
          }
          Copy-Item "native\kreepto-rust\target\release\kreepto.dll" $bundleDir

      - name: Package ZIP
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '/', '-'
          Compress-Archive -Path "build\windows\${{ matrix.arch }}\runner\Release\*" -DestinationPath "KeeStone-$tag-windows-${{ matrix.arch }}.zip"

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:LocalAppData}\Programs\Inno Setup 6\ISCC.exe"
          )
          if (-not ($candidates | Where-Object { Test-Path $_ } | Select-Object -First 1)) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $sourceDir = "${{ github.workspace }}\build\windows\${{ matrix.arch }}\runner\Release"
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:LocalAppData}\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after Inno Setup install." }
          $isccArgs = @("/DAPP_VERSION=$version", "/DSOURCE_DIR=$sourceDir")
          if ("${{ matrix.arch }}" -eq "arm64") {
            $isccArgs += "/DARM64"
          }
          & $iscc @isccArgs windows/inno_setup/keestone.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE" }

      - name: Verify Windows packages
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem -Path "KeeStone-*-windows-${{ matrix.arch }}.zip" -File)
          $installer = @(Get-ChildItem -Path "build/windows/installer" -Filter "KeeStone-*-windows-${{ matrix.arch }}-setup.exe" -File)
          if ($zip.Count -eq 0) { throw "Windows ${{ matrix.arch }} ZIP was not generated." }
          if ($installer.Count -eq 0) { throw "Windows ${{ matrix.arch }} installer was not generated." }
          $zip | ForEach-Object { Write-Host "Found ZIP: $($_.FullName)" }
          $installer | ForEach-Object { Write-Host "Found installer: $($_.FullName)" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            KeeStone-*-windows-${{ matrix.arch }}.zip
            build/windows/installer/KeeStone-*-windows-${{ matrix.arch }}-setup.exe

  build-linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            flutter_arch: x64
            deb_arch: amd64
            flutter_channel: stable
          - arch: arm64
            runner: ubuntu-24.04-arm
            flutter_arch: arm64
            deb_arch: arm64
            # Stable publishes no Linux arm64 archive; master clones the
            # pinned tag and bootstraps the host's own Dart/engine artifacts.
            flutter_channel: master
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.90.0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/kreepto-rust/target
          key: linux-${{ matrix.arch }}-cargo-${{ hashFiles('native/kreepto-rust/Cargo.toml') }}
          restore-keys: linux-${{ matrix.arch }}-cargo-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: ${{ matrix.flutter_channel }}
          cache: true

      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config libsecret-1-dev libayatana-appindicator3-dev

      - run: flutter --version

      - run: flutter pub get

      - name: Build kreepto native library
        run: cargo build --release
        working-directory: native/kreepto-rust

      - run: flutter build linux --release

      - name: Bundle native library
        run: |
          bundle_dir="build/linux/${{ matrix.flutter_arch }}/release/bundle"
          test -d "$bundle_dir"
          cp native/kreepto-rust/target/release/libkreepto.so "$bundle_dir/lib/"

      - name: Package tar.gz
        run: |
          tag="${{ github.ref_name }}"
          tag="${tag//\//-}"
          tar -czf "KeeStone-${tag}-linux-${{ matrix.arch }}.tar.gz" -C "build/linux/${{ matrix.flutter_arch }}/release/bundle" .

      - name: Package deb
        run: |
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          pkg_dir="keestone_${version}_${{ matrix.deb_arch }}"
          bundle_dir="build/linux/${{ matrix.flutter_arch }}/release/bundle"
          mkdir -p "$pkg_dir/DEBIAN"
          mkdir -p "$pkg_dir/opt/keestone"
          mkdir -p "$pkg_dir/usr/share/applications"
          mkdir -p "$pkg_dir/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "$pkg_dir/usr/bin"

          # Control file
          cat > "$pkg_dir/DEBIAN/control" << CTRL
          Package: keestone
          Version: ${version}
          Section: utils
          Priority: optional
          Architecture: ${{ matrix.deb_arch }}
          Maintainer: KeeStone
          Depends: libgtk-3-0, libsecret-1-0, libayatana-appindicator3-1, libdbus-1-3
          Description: A KeePass-compatible password manager
          CTRL
          sed -i 's/^          //' "$pkg_dir/DEBIAN/control"

          # Copy build files
          cp -r "$bundle_dir"/* "$pkg_dir/opt/keestone/"

          # Symlink to /usr/bin
          ln -s /opt/keestone/keestone "$pkg_dir/usr/bin/keestone"

          # Desktop entry
          cat > "$pkg_dir/usr/share/applications/keestone.desktop" << 'DESKTOP'
          [Desktop Entry]
          Name=KeeStone
          Comment=A KeePass-compatible password manager
          Exec=/opt/keestone/keestone
          Icon=keestone
          Type=Application
          Categories=Utility;
          DESKTOP
          sed -i 's/^          //' "$pkg_dir/usr/share/applications/keestone.desktop"

          # Icon (use linux/flutter/icon.png if available, otherwise skip)
          if [ -f linux/flutter/icon.png ]; then
            cp linux/flutter/icon.png "$pkg_dir/usr/share/icons/hicolor/256x256/apps/keestone.png"
          fi

          dpkg-deb --build "$pkg_dir"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            KeeStone-*-linux-${{ matrix.arch }}.tar.gz
            keestone_*_${{ matrix.deb_arch }}.deb

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/kreepto-rust/target
          key: android-cargo-${{ hashFiles('native/kreepto-rust/Cargo.toml') }}
          restore-keys: android-cargo-

      - name: Build kreepto for Android
        run: |
          set -e
          NDK_ROOT="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          if [ -z "$NDK_ROOT" ]; then
            echo "ERROR: Android NDK not found" >&2
            exit 1
          fi
          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"

          mkdir -p native/kreepto-rust/.cargo
          cat > native/kreepto-rust/.cargo/config.toml << EOF
          [target.aarch64-linux-android]
          linker = "$TOOLCHAIN/bin/aarch64-linux-android35-clang"
          ar = "$TOOLCHAIN/bin/llvm-ar"

          [target.armv7-linux-androideabi]
          linker = "$TOOLCHAIN/bin/armv7a-linux-androideabi35-clang"
          ar = "$TOOLCHAIN/bin/llvm-ar"

          [target.x86_64-linux-android]
          linker = "$TOOLCHAIN/bin/x86_64-linux-android35-clang"
          ar = "$TOOLCHAIN/bin/llvm-ar"
          EOF
          sed -i 's/^          //' native/kreepto-rust/.cargo/config.toml

          cd native/kreepto-rust
          cargo build --release --target aarch64-linux-android
          cargo build --release --target armv7-linux-androideabi
          cargo build --release --target x86_64-linux-android

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > keestone.jks

      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
        run: |
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=../../keestone.jks\n'
          } > android/key.properties

      - run: flutter pub get

      - name: Bundle native libraries for Android
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p android/app/src/main/jniLibs/$abi
          done
          cp native/kreepto-rust/target/aarch64-linux-android/release/libkreepto.so android/app/src/main/jniLibs/arm64-v8a/
          cp native/kreepto-rust/target/armv7-linux-androideabi/release/libkreepto.so android/app/src/main/jniLibs/armeabi-v7a/
          cp native/kreepto-rust/target/x86_64-linux-android/release/libkreepto.so android/app/src/main/jniLibs/x86_64/

      - run: flutter build apk --release --split-per-abi

      - name: Package
        run: |
          tag="${{ github.ref_name }}"
          tag="${tag//\//-}"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$apk" | sed 's/app-//;s/-release.apk//')
            cp "$apk" "KeeStone-${tag}-android-${abi}.apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: KeeStone-*.apk

  release:
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Flatten downloaded artifacts
        shell: bash
        run: |
          find . -mindepth 2 -type f \
            \( -name 'KeeStone-*' -o -name 'keestone_*.deb' \) \
            -exec cp -f {} . \;

          echo "Downloaded release files:"
          find . -maxdepth 1 -type f -print | sort

          installer_count=$(find . -maxdepth 1 -type f -name 'KeeStone-*-setup.exe' | wc -l)
          if [ "$installer_count" -eq 0 ]; then
            echo "Windows installer is missing after artifact download." >&2
            find . -maxdepth 4 -type f -print | sort
            exit 1
          fi

      - name: Generate checksums
        run: find . -maxdepth 1 -type f \( -name 'KeeStone-*' -o -name 'keestone_*' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            KeeStone-*.zip
            KeeStone-*.tar.gz
            KeeStone-*.apk
            KeeStone-*-setup.exe
            keestone_*.deb
            SHA256SUMS
  publish-aur:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update PKGBUILD version
        run: |
          sed -i "s/pkgver=.*/pkgver=${{ steps.version.outputs.version }}/" PKGBUILD
          sed -i "s/pkgrel=.*/pkgrel=1/" PKGBUILD

      - name: Resolve release archive checksums
        id: archive
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          base_url="https://github.com/${{ github.repository }}/releases/download/v${version}"

          declare -A files=(
            [x86_64]="KeeStone-v${version}-linux-x64.tar.gz"
            [aarch64]="KeeStone-v${version}-linux-arm64.tar.gz"
          )

          for arch in x86_64 aarch64; do
            file="${files[$arch]}"
            curl --fail --location --retry 4 -o "$file" "$base_url/$file"
            sum="$(sha256sum "$file" | cut -d' ' -f1)"
            echo "sha256_${arch}=${sum}" >> "$GITHUB_OUTPUT"
            echo "Resolved $file -> $sum"
          done

      - name: Update package metadata
        run: |
          sed -i "s/sha256sums_x86_64=.*/sha256sums_x86_64=('${{ steps.archive.outputs.sha256_x86_64 }}')/" PKGBUILD
          sed -i "s/sha256sums_aarch64=.*/sha256sums_aarch64=('${{ steps.archive.outputs.sha256_aarch64 }}')/" PKGBUILD
          docker run --rm -v "$PWD:/pkg" archlinux:base-devel bash -lc             "cd /pkg && useradd -m builder && chown -R builder:builder /pkg && su builder -c 'makepkg --printsrcinfo > .SRCINFO'"

      - name: Publish to AUR
        env:
          AUR_PKGNAME: keestone-bin
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
          AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          WORKSPACE_DIR="$PWD"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"

          rm -rf /tmp/local-repo
          echo "=> Cloning existing AUR repository via HTTPS..."

          if git clone "https://aur.archlinux.org/${AUR_PKGNAME}.git" /tmp/local-repo; then
            cd /tmp/local-repo
            git remote set-url origin "ssh://aur@aur.archlinux.org/${AUR_PKGNAME}.git"
          else
            echo "=> HTTPS clone failed, initializing fresh repository..."
            mkdir -p /tmp/local-repo
            cd /tmp/local-repo
            git init -b master
            git remote add origin "ssh://aur@aur.archlinux.org/${AUR_PKGNAME}.git"
          fi

          cp "$WORKSPACE_DIR/PKGBUILD" "$WORKSPACE_DIR/.SRCINFO" .

          git config user.name "$AUR_USERNAME"
          git config user.email "$AUR_EMAIL"

          git add PKGBUILD .SRCINFO
          if [ -z "$(git status --porcelain)" ]; then
            echo "=> No changes, skipping publish."
            exit 0
          fi

          git commit -m "Update ${AUR_PKGNAME} to ${{ steps.version.outputs.version }}"

          echo "=> Pushing to AUR..."
          for i in $(seq 1 5); do
            if git push -u origin master; then
              echo "=> Successfully pushed to AUR!"
              exit 0
            fi
            echo "=> Push failed, retrying in 10s ($i/5)..."
            sleep 10
          done

          echo "=> Failed to push to AUR after 5 retries." >&2
          exit 1
